# Releases of Ultima I: The First Age of Darkness. One [[release]] block each; see CONTRIBUTING.md for every field.

[[release]]
year = 1981
platform = "apple2"
type = "orig"
label = "Apple II (California Pacific)"
note = "The original release."

[[release]]
year = 1983
platform = "a8"
type = "port"
label = "Atari 8-bit (Sierra re-release)"
note = "Sierra On-Line re-release for Atari computers."

[[release]]
year = 1986
platform = "apple2"
type = "remake"
label = "Apple II remake (Origin)"
note = "Origin Systems remake released in December 1986 as Ultima I: The First Age of Darkness; the base for later ports."

[[release]]
year = 1986
platform = "c64"
type = "remake"
label = "Commodore 64 (remake)"
note = "Port of the 1986 remake."

[[release]]
year = 1987
platform = "dos"
type = "remake"
label = "MS-DOS (EGA remake)"
note = "EGA version of the remake. This is the version sold today on GOG and Steam."

[[release]]
