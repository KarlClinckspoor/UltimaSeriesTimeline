[[release]]
year = 2007
type = "engine"
label = "Ultima 1 Revenge"
note = "Reverse-engineering effort that reads the original game files. Unfinished by design; the author states it will never be done."
links = [ { name = "Bitbucket", url = "https://bitbucket.org/dandago/u1revenge" } ]

[[release]]
year = 2020
type = "engine"
label = "ScummVM Ultima I (in progress)"
note = "An Ultima I subengine based on a decompilation was added to ScummVM's Ultima engine, but it is still incomplete and not offered in release builds."
links = [ { name = "Announcement", url = "https://ultimacodex.com/2020/02/support-for-some-ultima-games-is-coming-to-scummvm/" }, { name = "ScummVM", url = "https://www.scummvm.org/" } ]

[[release]]
year = 2026
type = "decomp"
label = "u1-decompiled (Karl Clinckspoor)"
note = "Source for the PC remake (1986/87, conversion by John Fachini), rebuilt with Lattice C 3.1x, MASM 3.00 and Microsoft LINK into executables byte-identical to the GOG release. All five EXEs rebuild identical; GEN.EXE is decompiled to C and the rest still use generated assembly stand-ins. No playable port yet."
needs_data = true
links = [ { name = "GitHub", url = "https://github.com/KarlClinckspoor/u1-decompiled" }, { name = "Handoff notes", url = "https://github.com/KarlClinckspoor/u1-decompiled/blob/main/docs/HANDOFF.md" } ]

