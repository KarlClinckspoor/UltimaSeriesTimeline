[[release]]
year = 2026
type = "decomp"
label = "Ultima VI native port (Karl Clinckspoor)"
note = "Native Windows / Linux port on SDL2 built from the u6-decompiled sources, with GAME.EXE, U.EXE (title, intro, character creation) and END.EXE (the ending) decompiled. AdLib music through Nuked OPL3, and every session can be replayed exactly. In beta; the DOS build stays byte-identical. Also adds a readable branch with named functions and globals."
links = [ { name = "GitHub", url = "https://github.com/KarlClinckspoor/u6-decompiled" }, { name = "Releases", url = "https://github.com/KarlClinckspoor/u6-decompiled/releases" }, { name = "Port notes", url = "https://github.com/KarlClinckspoor/u6-decompiled/blob/main/docs/port/PORT.md" } ]

[[release]]
year = 2026
type = "fan"
label = "Ultima VI: Enhanced Edition (alpha, not public)"
note = "Kamakura Game Works' first-person reworking on Godot, with Nuvie handling the original files. Announced in November 2026 as a local alpha with no download yet."
links = [ { name = "Developer news", url = "https://kamakura-game-works.pages.dev/en/news/ultima-vi-enhanced-edition-new-chapter/" }, { name = "Codex entry", url = "https://ultima6.ultimacodex.com/ultima-vi-enhanced-edition/" } ]
