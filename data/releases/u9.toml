# Releases of Ultima IX: Ascension. One [[release]] block each; see CONTRIBUTING.md for every field.


[[release]]
year = 1999
platform = "win"
type = "orig"
label = "Windows"
note = "23 November 1999. Also sold as the Dragon Edition (1999) and Premium Edition (2000). GOG and Steam sell it today; no engine recreation exists."

