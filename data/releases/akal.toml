# Releases of Akalabeth: World of Doom. One [[release]] block each; see CONTRIBUTING.md for every field.


[[release]]
year = 1979
platform = "apple2"
type = "orig"
label = "Apple II (self-published)"
note = "Richard Garriott sold the first copies himself in zip-lock bags, with cover art by his mother."

[[release]]
year = 1980
platform = "apple2"
type = "orig"
label = "Apple II (California Pacific)"
note = "The published release; it sold over 30,000 copies and led directly to Ultima."

[[release]]
year = 1998
platform = "dos"
type = "port"
label = "MS-DOS port (Ultima Collection)"
note = "First official port off the Apple II, made for the 1998 Ultima Collection. GOG ships this version (Windows, Mac, Linux) and keeps the 1998 build in its extras."

[[release]]
year = 2016
approx = true
type = "fan"
label = "Fan port: Commodore 64"
note = "A full port of Akalabeth to the C64."
links = [ { name = "Codex entry", url = "https://akalabeth.ultimacodex.com/akalabeth-world-of-doom-for-commodore-64/" } ]
play = [ { name = "VICE", url = "https://vice-emu.sourceforge.io/" } ]

[[release]]
year = 2018
approx = true
type = "fan"
label = "Vecalabeth (Vectrex32)"
note = "Akalabeth for the Vectrex32 cartridge, which plugs into an original Vectrex."
links = [ { name = "Codex entry", url = "https://akalabeth.ultimacodex.com/vecalabeth/" } ]
play = [ { name = "Vectrex with a Vectrex32 cartridge" } ]

