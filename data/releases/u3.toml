[[release]]
year = 2026
type = "decomp"
label = "Ultima III modernized port (ChangeNode)"
note = "TypeScript rebuild of LairWare's Mac port, whose source was released in 2014, keeping the data files unchanged and adding a controller mode, auto-map, quest journal and shared inventory. Runs in the browser and on Windows, macOS, Linux, Android and Steam Deck; MIT licence."
links = [ { name = "Play in browser", url = "https://synthwave-pixel.github.io/ultima3/" }, { name = "GitHub", url = "https://github.com/synthwave-pixel/ultima3" }, { name = "Releases", url = "https://github.com/synthwave-pixel/ultima3/releases" }, { name = "LairWare source", url = "https://github.com/beastie/ultima3" } ]

