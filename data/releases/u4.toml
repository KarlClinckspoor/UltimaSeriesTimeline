[[release]]
year = 2004
approx = true
type = "engine"
label = "xu4"
note = "Faithful recreation of the engine that loads the original MS-DOS data files. It spent about 18 years in beta before version 1.0 in 2022; ports for Windows, macOS, Linux and Android."
links = [ { name = "SourceForge", url = "https://sourceforge.net/projects/xu4/" }, { name = "GitHub", url = "https://github.com/xu4-engine/u4" } ]

[[release]]
year = 2015
type = "fan"
label = "Ultima IV Remastered (C64)"
note = "Fan remaster of the Commodore 64 version with bug fixes and improvements; source on GitHub. Runs on a real C64 or in VICE."
links = [ { name = "GitHub", url = "https://github.com/MagerValp/u4remastered" } ]
play = [ { name = "VICE", url = "https://vice-emu.sourceforge.io/" }, { name = "Original C64 hardware" } ]

[[release]]
year = 2016
type = "decomp"
label = "u4-decompiled"
note = "Reverse compilation of the MS-DOS executables back to C by ergonomy_joe. A study codebase rather than a packaged port."
links = [ { name = "GitHub", url = "https://github.com/ergonomy-joe/u4-decompiled" }, { name = "Announcement", url = "https://ultimacodex.com/2016/12/ultima-4-decomplied/" } ]

[[release]]
year = 2020
type = "engine"
label = "ScummVM (xu4 subengine)"
note = "xu4 became a ScummVM subengine in 2020, with original and enhanced modes; supported since ScummVM 2.2."
links = [ { name = "ScummVM", url = "https://www.scummvm.org/" }, { name = "Compatibility", url = "https://www.scummvm.org/compatibility/" } ]

[[release]]
year = 2003
type = "fan"
label = "Avatarship (Neverwinter Nights)"
note = "Ultima IV remake by Zonker, first called Lyrac; version 1.3 in 2003."
links = [ { name = "Codex wiki", url = "https://wiki.ultimacodex.com/wiki/Avatarship" } ]
play = [ { name = "Requires Neverwinter Nights", url = "https://store.steampowered.com/search/?term=Neverwinter%20Nights" } ]

[[release]]
