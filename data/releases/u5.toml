[[release]]
year = 2019
type = "fan"
label = "Ultima V Redux (in development)"
note = "Brad Hannah's remake built on the original data. Began as a Unity voxel version, moved to a 2D Go/Ebiten engine in 2024, and was function-complete and heading to playtesting in September 2026."
needs_data = true
links = [ { name = "GitHub (Go)", url = "https://github.com/bradhannah/Ultima5ReduxGo" }, { name = "Codex page", url = "https://ultima5.ultimacodex.com/ultima-5-redux" } ]

[[release]]
type = "decomp"
label = "u5d (in progress)"
note = "Matching decompilation of the MS-DOS version, inspired by u4-decompiled. About half matched; it does not link a playable executable yet."
links = [ { name = "GitHub", url = "https://github.com/wonst719/u5d" } ]

[[release]]
