[[release]]
year = 2026
type = "engine"
label = "Ultima V modernized engine (synthwave-pixel)"
note = "TypeScript engine for the 1988 MS-DOS game that plays your own copy, for the browser, desktop, Steam Deck and Android. The project's page itself carries some of the game's assets (Ultima V Upgrade music, Apple II tiles and box art), so check its terms."
