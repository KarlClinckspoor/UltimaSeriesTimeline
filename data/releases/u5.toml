[[release]]
year = 2019
type = "fan"
label = "Ultima V Redux (public preview)"
note = "Brad Hannah's Go recreation, built on your own copy of the original data. Began as a Unity voxel version, moved to a 2D Go engine in 2024 and was function-complete in September 2026; downloadable preview builds for macOS, Windows and Linux now exist, along with a game-guide website."
needs_data = true
links = [ { name = "GitHub", url = "https://github.com/bradhannah/UltimaVRedux" }, { name = "Releases", url = "https://github.com/bradhannah/UltimaVRedux/releases" }, { name = "Game guide", url = "https://bradhannah.github.io/UltimaVRedux/" }, { name = "Codex page", url = "https://ultima5.ultimacodex.com/ultima-5-redux" } ]

