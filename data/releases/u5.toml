[[release]]
year = 2005
type = "fan"
label = "Ultima V: Lazarus"
note = "Full 3D remake built in the Dungeon Siege engine by Team Lazarus, released 22 December 2005. Needs Dungeon Siege, not Ultima V."
links = [ { name = "ModDB", url = "https://www.moddb.com/mods/ultima-v-lazarus" }, { name = "Codex downloads", url = "https://ultima5.ultimacodex.com/ultima-5-lazarus" }, { name = "Codex wiki", url = "https://wiki.ultimacodex.com/wiki/Lazarus" } ]
