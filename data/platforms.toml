# Hardware platforms. A release names one of these ids as its `platform`.
# `column` is the canon-table column it lands in (see site.toml). `store = true` means today's GOG/Steam copy runs this version.
# `emulators` = list of { name, url }. `original` = description of the original hardware.

[apple2]
name = "Apple II"
column = "apple2"
original = "Apple II / IIe with a 5.25\" drive"
emulators = [ { name = "AppleWin", url = "https://github.com/AppleWin/AppleWin" }, { name = "MAME", url = "https://www.mamedev.org/" } ]

[iigs]
name = "Apple IIGS"
column = "apple2"
original = "Apple IIGS"
emulators = [ { name = "MAME", url = "https://www.mamedev.org/" } ]

[a8]
name = "Atari 8-bit"
column = "a8"
original = "Atari 400/800/XL/XE with disk drive"
emulators = [ { name = "Altirra", url = "https://www.virtualdub.org/altirra.html" }, { name = "Atari800", url = "https://atari800.github.io/" } ]

[vic20]
name = "VIC-20"
column = "c64"
original = "Commodore VIC-20 with an 8K or 16K RAM expansion and a Datasette"
emulators = [ { name = "VICE (xvic)", url = "https://vice-emu.sourceforge.io/" } ]

[c64]
name = "C64"
column = "c64"
original = "Commodore 64/128 with 1541 drive"
emulators = [ { name = "VICE", url = "https://vice-emu.sourceforge.io/" } ]

[dos]
name = "MS-DOS"
column = "dos"
original = "Period IBM PC compatible"
store = true
emulators = [ { name = "DOSBox Staging", url = "https://www.dosbox-staging.org/" }, { name = "DOSBox-X", url = "https://dosbox-x.com/" } ]

[st]
name = "Atari ST"
column = "st"
original = "Atari ST / STE"
emulators = [ { name = "Hatari", url = "https://www.hatari-emu.org/" } ]

[amiga]
name = "Amiga"
column = "amiga"
original = "Commodore Amiga"
emulators = [ { name = "FS-UAE", url = "https://fs-uae.net/" }, { name = "WinUAE", url = "https://www.winuae.net/" } ]

[mac]
name = "Macintosh"
column = "mac"
original = "Compact 68k Macintosh"
emulators = [ { name = "Mini vMac", url = "https://www.gryphel.com/c/minivmac/" } ]

